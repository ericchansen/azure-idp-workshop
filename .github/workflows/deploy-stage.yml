name: PR Staging

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: pr-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: rg-idp-workshop
  ACR_NAME: idpworkshopacr
  IMAGE_NAME: idp-workshop
  CONTAINERAPP_NAME: idp-workshop

jobs:
  deploy:
    name: Deploy Preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tag
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image_ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & Push
        run: |
          docker build -t ${{ steps.vars.outputs.image_ref }} .
          docker push ${{ steps.vars.outputs.image_ref }}

      - name: Deactivate previous PR revisions
        continue-on-error: true
        run: |
          REVISIONS=$(az containerapp revision list \
            --name ${{ env.CONTAINERAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[?contains(name, '--pr-${{ github.event.pull_request.number }}')].name" -o tsv)
          for REV in $REVISIONS; do
            echo "Deactivating old revision: $REV"
            az containerapp revision deactivate \
              --name ${{ env.CONTAINERAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --revision "$REV" || true
          done

      - name: Deploy preview revision
        id: review
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          SHORT_SHA=${{ steps.vars.outputs.short_sha }}
          REVISION_SUFFIX="pr-${PR_NUM}-${SHORT_SHA}"

          az containerapp update \
            --name ${{ env.CONTAINERAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ steps.vars.outputs.image_ref }} \
            --revision-suffix "$REVISION_SUFFIX" \
            --output none

          # Set the new revision to 0% traffic (label-only)
          REVISION_NAME="${{ env.CONTAINERAPP_NAME }}--${REVISION_SUFFIX}"
          az containerapp revision label add \
            --name ${{ env.CONTAINERAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --label "pr-${PR_NUM}" \
            --revision "$REVISION_NAME" \
            --no-prompt --output none || true

          # Get the FQDN for the labeled revision
          APP_FQDN=$(az containerapp show \
            --name ${{ env.CONTAINERAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          PREVIEW_URL="https://${{ env.CONTAINERAPP_NAME }}---${REVISION_SUFFIX}.${APP_FQDN#*\.}"

          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $PREVIEW_URL"

      - name: Wait for revision health
        run: |
          PREVIEW_URL="${{ steps.review.outputs.preview_url }}"
          echo "Preview URL: $PREVIEW_URL"
          for i in {1..30}; do
            if curl -sf "${PREVIEW_URL}/api/health" >/dev/null 2>&1; then
              echo "✅ Preview is healthy"
              exit 0
            fi
            echo "Attempt $i: waiting..."
            sleep 10
          done
          echo "⚠️ Health check timed out (preview may still be starting)"

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.review.outputs.preview_url }}';
            const sha = '${{ github.sha }}'.substring(0, 7);
            const marker = '## 🚀 PR Preview';
            const body = [
              marker,
              '',
              `| Resource | URL |`,
              `|----------|-----|`,
              `| **Preview** | ${url} |`,
              `| **Health** | ${url}/api/health |`,
              '',
              `**Commit:** \`${sha}\``,
              '',
              '_This is a zero-traffic revision. It will be deactivated when the PR is closed._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Step summary
        run: |
          echo "## 🚀 PR Preview Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${{ steps.review.outputs.preview_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"

  deactivate:
    name: Deactivate Preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deactivate review revisions
        run: |
          REVISIONS=$(az containerapp revision list \
            --name ${{ env.CONTAINERAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[?contains(name, '--pr-${{ github.event.pull_request.number }}')].name" -o tsv)
          for REV in $REVISIONS; do
            echo "Deactivating revision: $REV"
            az containerapp revision deactivate \
              --name ${{ env.CONTAINERAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --revision "$REV" || true
          done

      - name: Update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const merged = ${{ github.event.pull_request.merged }};
            const status = merged ? '🎉 Merged' : '❌ Closed';
            const marker = '## 🚀 PR Preview';
            const body = [
              marker,
              '',
              `**Status:** 🗑️ Deactivated (PR ${status.toLowerCase()})`,
              '',
              '_The preview revision has been deactivated._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            }

      - name: Step summary
        run: |
          echo "## 🗑️ PR Preview Deactivated" >> "$GITHUB_STEP_SUMMARY"
          echo "Revision for PR #${{ github.event.pull_request.number }} has been deactivated." >> "$GITHUB_STEP_SUMMARY"
