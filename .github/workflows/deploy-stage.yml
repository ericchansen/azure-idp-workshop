name: Deploy Staging

# NOTE: PR-triggered deploys are disabled because the Microsoft tenant
# Conditional Access policy (AADSTS53003) blocks OIDC / service-principal
# auth from GitHub Actions runner IPs. Use workflow_dispatch for manual
# staging deploys, or run `az` CLI locally.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy (used for image tagging)'
        required: false
        default: 'manual'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AZURE_RESOURCE_GROUP: rg-idp-workshop
  ACR_NAME: idpworkshopacr
  IMAGE_NAME: idp-workshop

jobs:
  deploy:
    name: Deploy Stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure infrastructure
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            environmentName=stage
            acrName=${{ env.ACR_NAME }}
          failOnStdErr: false

      - name: Re-authenticate
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & Push
        id: image
        run: |
          IMAGE_TAG=stage-${{ github.event.inputs.pr_number || 'manual' }}
          IMAGE_REF=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG}
          docker build -t ${IMAGE_REF} .
          docker push ${IMAGE_REF}
          echo "image-ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Re-authenticate for app deploy
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy app with image
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            environmentName=stage
            acrName=${{ env.ACR_NAME }}
            containerImage=${{ steps.image.outputs.image-ref }}
          failOnStdErr: false

      - name: Print staging URL
        run: echo "🚀 Staging app deployed — check Azure Portal for the URL"
