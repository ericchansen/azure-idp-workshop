name: PR Staging

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: pr-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: rg-idp-workshop
  ACR_NAME: idpworkshopacr
  IMAGE_NAME: idp-workshop
  CONTAINERAPP_NAME: idp-workshop
  ENVIRONMENT: staging
  AI_SERVICES_NAME: idp-workshop-ai
  STORAGE_ACCOUNT_NAME: idpworkshopstorage
  SEARCH_SERVICE_NAME: idp-workshop-search
  IDENTITY_NAME: idp-id

jobs:
  deploy:
    name: Deploy Preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.review.outputs.preview_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure infrastructure
        id: infra
        uses: azure/bicep-deploy@4d5dc29bf04d05546dd5df9c665c54b9c5213207 # v2
        with:
          type: deployment
          operation: create
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          template-file: infra/main.bicep
          parameters: >-
            {"environmentName": "prod", "acrName": "${{ env.ACR_NAME }}"}

      - name: Resolve runtime env
        id: runtime
        run: |
          AI_SERVICES_ENDPOINT=$(az cognitiveservices account show \
            --name ${{ env.AI_SERVICES_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.endpoint" -o tsv)
          STORAGE_ACCOUNT_URL=$(az storage account show \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "primaryEndpoints.blob" -o tsv)
          AZURE_CLIENT_ID=$(az identity show \
            --name ${{ env.IDENTITY_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "clientId" -o tsv)

          echo "ai_services_endpoint=${AI_SERVICES_ENDPOINT}" >> "$GITHUB_OUTPUT"
          echo "storage_account_url=${STORAGE_ACCOUNT_URL}" >> "$GITHUB_OUTPUT"
          echo "ais_endpoint=https://${{ env.SEARCH_SERVICE_NAME }}.search.windows.net" >> "$GITHUB_OUTPUT"
          echo "azure_client_id=${AZURE_CLIENT_ID}" >> "$GITHUB_OUTPUT"

      - name: Ensure role assignments
        run: |
          PRINCIPAL_ID="${{ steps.infra.outputs.identityPrincipalId }}"
          RG_SCOPE="/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.AZURE_RESOURCE_GROUP }}"

          # Storage Blob Data Contributor
          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "ba92f5b4-2d11-453d-a403-e96b0029c9fe" \
            --scope "$RG_SCOPE" \
            --only-show-errors 2>&1 || true

          # Cognitive Services User
          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "a97b65f3-24c7-4388-baec-2e87135dc908" \
            --scope "$RG_SCOPE" \
            --only-show-errors 2>&1 || true

          # ACR Pull
          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "7f951dda-4ed3-4680-a7ca-43fe172d538d" \
            --scope "$RG_SCOPE" \
            --only-show-errors 2>&1 || true

          # Search Index Data Contributor (read/write indexes and documents)
          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "8ebe5a00-799e-43f5-93ac-243d3dce84a7" \
            --scope "$RG_SCOPE" \
            --only-show-errors 2>&1 || true

          # Search Service Contributor (manage search service and indexes)
          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "7ca78c08-252a-4471-8644-bb5ff32d4ba0" \
            --scope "$RG_SCOPE" \
            --only-show-errors 2>&1 || true

      - name: Ensure multi-revision mode
        run: |
          az containerapp revision set-mode \
            --name ${{ env.CONTAINERAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --mode multiple \
            --output none

      - name: Set image tag
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image_ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & Push
        run: |
          docker build -t ${{ steps.vars.outputs.image_ref }} .
          docker push ${{ steps.vars.outputs.image_ref }}

      - name: Deactivate previous PR revisions
        continue-on-error: true
        run: |
          REVISIONS=$(az containerapp revision list \
            --name ${{ env.CONTAINERAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[?contains(name, '--pr-${{ github.event.pull_request.number }}')].name" -o tsv)
          for REV in $REVISIONS; do
            echo "Deactivating old revision: $REV"
            az containerapp revision deactivate \
              --name ${{ env.CONTAINERAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --revision "$REV" || true
          done

      - name: Deploy preview revision
        id: review
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          SHORT_SHA=${{ steps.vars.outputs.short_sha }}
          REVISION_SUFFIX="pr-${PR_NUM}-${SHORT_SHA}"

          # Capture the current production revision before creating the PR revision
          PROD_REVISION=$(az containerapp ingress traffic show \
            --name ${{ env.CONTAINERAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[?weight==\`100\`].revisionName | [0]" -o tsv 2>/dev/null || true)
          if [ -z "$PROD_REVISION" ]; then
            PROD_REVISION=$(az containerapp revision list \
              --name ${{ env.CONTAINERAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --query "sort_by([?properties.active], &properties.createdTime)[-1].name" -o tsv)
          fi
          echo "Production revision: $PROD_REVISION"

          az containerapp update \
            --name ${{ env.CONTAINERAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ steps.vars.outputs.image_ref }} \
            --revision-suffix "$REVISION_SUFFIX" \
            --set-env-vars \
              ENVIRONMENT=${{ env.ENVIRONMENT }} \
              AI_SERVICES_ENDPOINT=${{ steps.runtime.outputs.ai_services_endpoint }} \
              STORAGE_ACCOUNT_URL=${{ steps.runtime.outputs.storage_account_url }} \
              LOG_LEVEL=INFO \
              AZURE_CLIENT_ID=${{ steps.runtime.outputs.azure_client_id }} \
              CU_COMPLETION_DEPLOYMENT=gpt-4.1 \
              CU_EMBEDDING_DEPLOYMENT=text-embedding-3-large \
              AIS_ENDPOINT=${{ steps.runtime.outputs.ais_endpoint }} \
              AIS_INDEX_NAME=workshop-documents-pr-${PR_NUM} \
            --output none

          # Ensure production revision keeps 100% traffic
          if [ -n "$PROD_REVISION" ]; then
            az containerapp ingress traffic set \
              --name ${{ env.CONTAINERAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --revision-weight "$PROD_REVISION=100" \
              --output none || true
          fi

          # Assign label for direct URL routing
          REVISION_NAME="${{ env.CONTAINERAPP_NAME }}--${REVISION_SUFFIX}"
          az containerapp revision label add \
            --name ${{ env.CONTAINERAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --label "pr-${PR_NUM}" \
            --revision "$REVISION_NAME" \
            --no-prompt --output none || true

          # Get the FQDN for the labeled revision
          APP_FQDN=$(az containerapp show \
            --name ${{ env.CONTAINERAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          PREVIEW_URL="https://${{ env.CONTAINERAPP_NAME }}---pr-${PR_NUM}.${APP_FQDN#*\.}"

          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $PREVIEW_URL"

      - name: Wait for revision health
        run: |
          PREVIEW_URL="${{ steps.review.outputs.preview_url }}"
          echo "Preview URL: $PREVIEW_URL"
          for i in {1..30}; do
            if curl -sf "${PREVIEW_URL}/api/health" >/dev/null 2>&1; then
              echo "✅ Preview is healthy"
              exit 0
            fi
            echo "Attempt $i: waiting..."
            sleep 10
          done
          echo "⚠️ Health check timed out (preview may still be starting)"

      - name: Comment PR with preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = '${{ steps.review.outputs.preview_url }}';
            const sha = '${{ github.sha }}'.substring(0, 7);
            const marker = '## 🚀 PR Preview';
            const body = [
              marker,
              '',
              `| Resource | URL |`,
              `|----------|-----|`,
              `| **Preview** | ${url} |`,
              `| **Health** | ${url}/api/health |`,
              '',
              `**Commit:** \`${sha}\``,
              '',
              '_This is a zero-traffic revision. It will be deactivated when the PR is closed._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Step summary
        run: |
          echo "## 🚀 PR Preview Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${{ steps.review.outputs.preview_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E Tests (Preview)
    needs: deploy
    if: needs.deploy.outputs.preview_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium msedge

      - name: Run structural E2E tests against preview
        run: npx playwright test --grep-invert Smoke --project="Desktop Edge"
        env:
          BASE_URL: ${{ needs.deploy.outputs.preview_url }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-report-staging
          path: playwright-report/
          retention-days: 14

  deactivate:
    name: Deactivate Preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deactivate review revisions
        run: |
          REVISIONS=$(az containerapp revision list \
            --name ${{ env.CONTAINERAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[?contains(name, '--pr-${{ github.event.pull_request.number }}')].name" -o tsv)
          for REV in $REVISIONS; do
            echo "Deactivating revision: $REV"
            az containerapp revision deactivate \
              --name ${{ env.CONTAINERAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --revision "$REV" || true
          done

      - name: Delete PR search index
        run: |
          INDEX_NAME="workshop-documents-pr-${{ github.event.pull_request.number }}"
          SEARCH_ENDPOINT="https://${{ env.SEARCH_SERVICE_NAME }}.search.windows.net"
          SEARCH_ADMIN_KEY=$(az search admin-key show \
            --service-name ${{ env.SEARCH_SERVICE_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query primaryKey -o tsv)

          HTTP_STATUS=$(curl -sS -o delete-index-response.txt -w "%{http_code}" \
            -X DELETE "${SEARCH_ENDPOINT}/indexes/${INDEX_NAME}?api-version=2024-07-01" \
            -H "Content-Type: application/json" \
            -H "api-key: ${SEARCH_ADMIN_KEY}")

          if [ "$HTTP_STATUS" = "204" ]; then
            echo "Deleted preview search index: $INDEX_NAME"
          elif [ "$HTTP_STATUS" = "404" ]; then
            echo "Preview search index not found, nothing to delete: $INDEX_NAME"
          else
            echo "Failed to delete preview search index: $INDEX_NAME"
            cat delete-index-response.txt
            exit 1
          fi

      - name: Update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const merged = ${{ github.event.pull_request.merged }};
            const status = merged ? '🎉 Merged' : '❌ Closed';
            const marker = '## 🚀 PR Preview';
            const body = [
              marker,
              '',
              `**Status:** 🗑️ Deactivated (PR ${status.toLowerCase()})`,
              '',
              '_The preview revision has been deactivated._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            }

      - name: Step summary
        run: |
          echo "## 🗑️ PR Preview Deactivated" >> "$GITHUB_STEP_SUMMARY"
          echo "Revision for PR #${{ github.event.pull_request.number }} has been deactivated." >> "$GITHUB_STEP_SUMMARY"
