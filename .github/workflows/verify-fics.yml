name: Verify FICs
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Azure Login (old app reg for investigation)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: 9e20e38c-b48d-4759-a415-b827172ab076
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Diagnose
        env:
          CONFIGURED_TENANT: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          echo "=== Subscription tenant ==="
          SUB_TENANT=$(az account show --query tenantId -o tsv)
          echo "Subscription tenant: $SUB_TENANT"
          echo "Configured AZURE_TENANT_ID: $CONFIGURED_TENANT"

          echo ""
          echo "=== UAMI tenant ==="
          UAMI_TENANT=$(az identity show --name idp-deploy --resource-group rg-idp-workshop --query tenantId -o tsv)
          echo "UAMI tenant: $UAMI_TENANT"

          echo ""
          if [ "$CONFIGURED_TENANT" != "$UAMI_TENANT" ]; then
            echo "⚠️  TENANT MISMATCH! AZURE_TENANT_ID ($CONFIGURED_TENANT) != UAMI tenant ($UAMI_TENANT)"
            echo "The azure/login action needs to use the UAMI's tenant: $UAMI_TENANT"
          else
            echo "✅ Tenants match"
          fi

          echo ""
          echo "=== UAMI details ==="
          az identity show --name idp-deploy --resource-group rg-idp-workshop -o json
