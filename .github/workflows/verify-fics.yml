name: Verify FICs
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Azure Login (old app reg)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: 9e20e38c-b48d-4759-a415-b827172ab076
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: List FICs on idp-deploy
        run: |
          az identity federated-credential list \
            --identity-name idp-deploy \
            --resource-group rg-idp-workshop \
            --query "[].{name:name, subject:subject}" -o table
