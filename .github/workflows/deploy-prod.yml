name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-idp-workshop
  ACR_NAME: idpworkshopacr
  IMAGE_NAME: idp-workshop
  ENVIRONMENT: prod
  AI_SERVICES_NAME: idp-workshop-ai
  STORAGE_ACCOUNT_NAME: idpworkshopstorage
  SEARCH_SERVICE_NAME: idp-workshop-search
  IDENTITY_NAME: idp-id

jobs:
  deploy:
    name: Deploy Prod
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    outputs:
      app_url: ${{ steps.deploy.outputs.app_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure infrastructure
        id: infra
        uses: azure/bicep-deploy@66910e9c5c7733c33a1cd605030d02234b3bc4ed # v2
        with:
          type: deployment
          operation: create
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          template-file: infra/main.bicep
          parameters: >-
            {"environmentName": "${{ env.ENVIRONMENT }}", "acrName": "${{ env.ACR_NAME }}"}

      - name: Ensure role assignments
        run: |
          PRINCIPAL_ID="${{ steps.infra.outputs.identityPrincipalId }}"
          RG_SCOPE="/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.AZURE_RESOURCE_GROUP }}"

          # Storage Blob Data Contributor
          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "ba92f5b4-2d11-453d-a403-e96b0029c9fe" \
            --scope "$RG_SCOPE" \
            --only-show-errors 2>&1 || true

          # Cognitive Services User
          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "a97b65f3-24c7-4388-baec-2e87135dc908" \
            --scope "$RG_SCOPE" \
            --only-show-errors 2>&1 || true

          # ACR Pull
          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "7f951dda-4ed3-4680-a7ca-43fe172d538d" \
            --scope "$RG_SCOPE" \
            --only-show-errors 2>&1 || true

          # Search Index Data Contributor (read/write indexes and documents)
          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "8ebe5a00-799e-43f5-93ac-243d3dce84a7" \
            --scope "$RG_SCOPE" \
            --only-show-errors 2>&1 || true

          # Search Service Contributor (manage search service and indexes)
          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role "7ca78c08-252a-4471-8644-bb5ff32d4ba0" \
            --scope "$RG_SCOPE" \
            --only-show-errors 2>&1 || true

      - name: Re-authenticate
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & Push
        id: image
        run: |
          IMAGE_TAG=sha-${GITHUB_SHA::8}
          IMAGE_REF=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG}
          docker build -t ${IMAGE_REF} .
          docker push ${IMAGE_REF}
          echo "image-ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Resolve runtime env
        id: runtime
        run: |
          AI_SERVICES_ENDPOINT=$(az cognitiveservices account show \
            --name ${{ env.AI_SERVICES_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.endpoint" -o tsv)
          STORAGE_ACCOUNT_URL=$(az storage account show \
            --name ${{ env.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "primaryEndpoints.blob" -o tsv)
          AZURE_CLIENT_ID=$(az identity show \
            --name ${{ env.IDENTITY_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "clientId" -o tsv)

          echo "ai_services_endpoint=${AI_SERVICES_ENDPOINT}" >> "$GITHUB_OUTPUT"
          echo "storage_account_url=${STORAGE_ACCOUNT_URL}" >> "$GITHUB_OUTPUT"
          echo "ais_endpoint=https://${{ env.SEARCH_SERVICE_NAME }}.search.windows.net" >> "$GITHUB_OUTPUT"
          echo "azure_client_id=${AZURE_CLIENT_ID}" >> "$GITHUB_OUTPUT"

      - name: Deploy app revision
        id: deploy
        run: |
          az containerapp update \
            --name idp-workshop \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ steps.image.outputs.image-ref }} \
            --set-env-vars \
              ENVIRONMENT=${{ env.ENVIRONMENT }} \
              AI_SERVICES_ENDPOINT=${{ steps.runtime.outputs.ai_services_endpoint }} \
              STORAGE_ACCOUNT_URL=${{ steps.runtime.outputs.storage_account_url }} \
              LOG_LEVEL=INFO \
              AZURE_CLIENT_ID=${{ steps.runtime.outputs.azure_client_id }} \
              CU_COMPLETION_DEPLOYMENT=gpt-4.1 \
              CU_EMBEDDING_DEPLOYMENT=text-embedding-3-large \
              AIS_ENDPOINT=${{ steps.runtime.outputs.ais_endpoint }} \
              AIS_INDEX_NAME=workshop-documents \
            --output none

          APP_URL=$(az containerapp show \
            --name idp-workshop \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "app_url=https://${APP_URL}" >> "$GITHUB_OUTPUT"

      - name: Route traffic to latest revision
        run: |
          az containerapp ingress traffic set \
            --name idp-workshop \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --revision-weight latest=100 \
            --output none

      - name: Wait for app health
        run: |
          APP_URL="${{ steps.deploy.outputs.app_url }}"
          echo "Waiting for $APP_URL to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf "${APP_URL}/api/health" >/dev/null 2>&1; then
              echo "✅ App is healthy"
              exit 0
            fi
            echo "Attempt $i/30: waiting..."
            sleep 10
          done
          echo "⚠️ Health check timed out (app may still be starting)"

      - name: Show App URL
        run: echo "🚀 Production deployed to ${{ steps.deploy.outputs.app_url }}"

  smoke-test:
    name: Production Smoke Test
    needs: deploy
    if: needs.deploy.outputs.app_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium msedge

      - name: Run smoke tests against production
        run: npx playwright test --grep Smoke --project="Desktop Edge"
        env:
          BASE_URL: ${{ needs.deploy.outputs.app_url }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 14
