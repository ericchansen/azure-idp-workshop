name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-idp-workshop
  ACR_NAME: idpworkshopacr
  IMAGE_NAME: idp-workshop
  ENVIRONMENT: prod

jobs:
  deploy:
    name: Deploy Prod
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Azure Login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure infrastructure
        uses: azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5 # v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            environmentName=${{ env.ENVIRONMENT }}
            acrName=${{ env.ACR_NAME }}
          failOnStdErr: false

      - name: Re-authenticate
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & Push
        id: image
        run: |
          IMAGE_TAG=sha-${GITHUB_SHA::8}
          IMAGE_REF=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG}
          docker build -t ${IMAGE_REF} .
          docker push ${IMAGE_REF}
          echo "image-ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Re-authenticate for app deploy
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy app with image
        id: deploy
        uses: azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5 # v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            environmentName=${{ env.ENVIRONMENT }}
            acrName=${{ env.ACR_NAME }}
            containerImage=${{ steps.image.outputs.image-ref }}
          failOnStdErr: false

      - name: Route traffic to latest revision
        run: |
          az containerapp ingress traffic set \
            --name idp-workshop \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --revision-weight latest=100 \
            --output none

      - name: Show App URL
        run: echo "🚀 Production deployed to ${{ steps.deploy.outputs.appUrl }}"
